# -----------------------------------------------------------------------
# MCUboot configuration for zephyr-linux-ble-copro
# -----------------------------------------------------------------------

# No image signing/verification (add key-based signing later)
CONFIG_BOOT_SIGNATURE_TYPE_NONE=y

# USB CDC-ACM serial recovery (SMP/mcumgr protocol over USB)
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_USB_DEVICE_STACK=y

# Enter serial recovery when app requests it via retention boot mode
CONFIG_BOOT_SERIAL_BOOT_MODE=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y

# Stay in serial recovery if there is no valid application
CONFIG_BOOT_SERIAL_NO_APPLICATION=y

# Do not use GPIO button to enter serial recovery (use boot mode only)
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n

# Blink LED during serial recovery to indicate DFU mode
CONFIG_MCUBOOT_INDICATION_LED=y

# Erase flash progressively (avoids long stall at DFU start on nRF)
CONFIG_BOOT_ERASE_PROGRESSIVELY=y

# Logging
CONFIG_LOG=y
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
